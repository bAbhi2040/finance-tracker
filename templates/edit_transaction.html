<head>
    <title>Personal Finance App</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >
</head>

<div class="container">
    <h1>Edit Transaction</h1>

    <div class="section">
        <form method="POST">
            <input
                type="number"
                step="0.01"
                name="amount"
                value="{{ transaction.amount }}"
            >

            <br><br>

            <select name="category">
                <option value="Food"
                    {% if transaction.category == "Food" %}
                        selected
                    {% endif %}
                >
                    Food
                </option>
                <option value="Housing"
                    {% if transaction.category == "Housing" %}
                        selected
                    {% endif %}
                >
                    Housing
                </option>
                <option value="Transportation"
                    {% if transaction.category == "Transportation" %}
                        selected
                    {% endif %}
                >
                    Transportation
                </option>
                <option value="Entertainment"
                    {% if transaction.category == "Entertainment" %}
                        selected
                    {% endif %}
                >
                    Entertainment
                </option>
                <option value="Healthcare"
                    {% if transaction.category == "Healthcare" %}
                        selected
                    {% endif %}
                >
                    Healthcare
                </option>
                <option value="Other"
                    {% if transaction.category == "Other" %}
                        selected
                    {% endif %}
                >
                    Other
                </option>
                <option value="Income"
                    {% if transaction.category == "Income" %}
                        selected
                    {% endif %}
                >
                    Income
                </option>
            </select>

            <br><br>

            <input
                name="description"
                value="{{ transaction.description }}"
            >

            <br><br>

            <select name="transaction_type">
                <option value="Income"
                    {% if transaction.transaction_type == "Income" %}
                        selected
                    {% endif %}
                >
                    Income
                </option>
                <option value="Expense"
                    {% if transaction.transaction_type == "Expense" %}
                        selected
                    {% endif %}
                >
                    Expense
                </option>
            </select>

            <br><br>

            <input
                type="date"
                name="date"
                placeholder="Date"
                value="{{ transaction.transaction_date.isoformat() }}"
            >

            <br><br>

            <button type="submit">
                Edit Transaction
            </button>
        </form>
    </div>

    <div class="section">
    {% if error %}
        <p class="error">{{ error }}</p>
    {% endif %}
    </div>   
</div>
