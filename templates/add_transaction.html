<head>
    <title>Personal Finance App</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >
</head>

<div class="container">

    <h1>Add Transaction</h1>

    <div class="section">

        <form method="POST">

            <input
                type="number"
                step="0.01"
                name="amount"
                placeholder="Amount"
            >

            <br><br>

            <input
                name="category"
                placeholder="Category"
            >

            <br><br>

            <input
                name="description"
                placeholder="Description"
            >

            <br><br>

            <select name="transaction_type">
                <option value="Income">Income</option>
                <option value="Expense">Expense</option>
            </select>

            <br><br>

            <button type="submit">
                Add Transaction
            </button>

        </form>

    </div>

</div>
